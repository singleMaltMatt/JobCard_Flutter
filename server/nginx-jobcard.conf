# Add these blocks inside the existing server { } for jobtracking.globalsense.co.za
# File: /etc/nginx/sites-enabled/jobcard_tracker.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

# ── App distribution (APK downloads + landing page) ──────────────────────────
location /download/ {
    alias /var/www/jobcard-app/;
    autoindex off;

    # Serve .apk with the correct MIME type so the browser downloads it and
    # hands off to the Android package installer instead of showing garbage.
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
}

# ── Version manifest (polled by the app on launch) ───────────────────────────
# Must never be cached, or clients keep seeing an old "latest_version".
location = /version.json {
    alias /var/www/jobcard-app/version.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
